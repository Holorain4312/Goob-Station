- type: species
  id: Molluscoid
  name: species-name-molluscoid
  roundStart: true
  prototype: MobMolluscoid
  sprites: MobMolluscoidSprites
  markingLimits: MobMolluscoidMarkingLimits
  dollPrototype: MobMolluscoidDummy
  skinColoration: Hues

# The lack of a layer means that
# this person cannot have round-start anything
# applied to that layer. It has to instead
# be defined as a 'custom base layer'
# in either the mob's starting marking prototype,
# or it has to be added in C#.
- type: speciesBaseSprites
  id: MobMolluscoidSprites
  sprites:
    Special: MobHumanoidAnyMarking
    Head: MobMolluscoidHead
    Chest: MobMolluscoidChest
    Groin: MobMolluscoidGroin
    HeadTop: MobHumanoidAnyMarking
    LArm: MobMolluscoidLArm
    RArm: MobMolluscoidRArm
    LHand: MobMolluscoidLHand
    RHand: MobMolluscoidRHand
    LLeg: MobMolluscoidLLeg
    RLeg: MobMolluscoidRLeg
    LFoot: MobMolluscoidLFoot
    RFoot: MobMolluscoidRFoot
    Tail: MobHumanoidAnyMarking # Goobstation - Required for felinids, harpies & tajaran.
    HeadSide: MobHumanoidAnyMarking # Oni port from DeltaV

- type: markingPoints
  id: MobMolluscoidMarkingLimits
  points:
    Special: # the cat ear joke, its real *godo*
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      required: false
    Snout:
      points: 1
      required: false
    Tail: # the cat tail joke, its real *godo*
      points: 1
      required: false
    HeadTop:
      points: 1
      required: false
    Chest:
      points: 3
      required: false
    Legs:
      points: 2
      required: false
    Arms:
      points: 2
      required: false


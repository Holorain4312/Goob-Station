- type: entity
  id: PartMolluscoid
  parent: [BaseItem, BasePart]
  name: "Molluscoid body part"
  abstract: true
  components:
  - type: Sprite
    sprite: _Goobstation/Mobs/Species/Molluscoid/parts.rsi
    state: "chest_m"
  - type: Icon
    sprite: _Goobstation/Mobs/Species/Molluscoid/parts.rsi
    state: "chest_m"
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10
  - type: Damageable
    damageContainer: Biological # Molluscoid
    damageModifierSet: Molluscoid

- type: entity
  id: ChestMolluscoid
  name: "Molluscoid chest"
  parent: [PartMolluscoid, BaseChest]
  components:
    - type: Sprite
      state: "chest_m"
    - type: Icon
      state: "chest_m"
    - type: Damageable
      damageModifierSet: MolluscoidShell

